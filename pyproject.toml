[project]
name = "guestlink"
version = "0.1.0"
# Pinned to the production target: Namecheap's cPanel Python selector caps at
# 3.9, and Django 4.2 LTS is the last release supporting it. Local dev matches
# deliberately — testing against a different Django major than production is
# how breakage reaches the server unnoticed. See DEPLOY.md.
requires-python = ">=3.9,<3.10"
dependencies = [
    "anthropic",
    "django>=4.2,<5.0",
    "pillow>=10.0.0,<12.0.0",
    "qrcode>=7.4,<9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "whitenoise>=6.6,<7.0",
]
