<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Reef · table card (square)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --petrol: #0d4650;
      --sea: #17727f;
      --sea-soft: #2f97a3;
      --cream: #f6efe2;
      --ink: #143840;
      --muted: #5f7b81;
      --terracotta: #d9694a;
      --wa: #1fab54;
    }
    @page { size: 105mm 105mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #d9d4c8; }
    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .card {
      position: relative;
      width: 105mm; height: 105mm;
      background: var(--cream);
      overflow: hidden;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
      display: flex; flex-direction: column;
    }
    /* ---- hero ---- */
    .hero {
      position: relative;
      padding: 5mm 7mm 0; text-align: center; color: #fff;
      background:
        radial-gradient(120% 90% at 78% -10%, rgba(47,151,163,0.55) 0%, transparent 55%),
        linear-gradient(165deg, var(--sea) 0%, var(--petrol) 100%);
    }
    .eyebrow {
      font-size: 7.5pt; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }
    .hero h1 {
      margin: 2mm 0 0; font-family: "Fraunces", Georgia, serif;
      font-weight: 400; font-style: italic; font-size: 19pt; line-height: 1.0;
      letter-spacing: -0.02em;
    }
    .hero h1::after {
      content: ""; display: block; width: 11mm; height: 0.6mm; margin: 2mm auto 0;
      background: var(--terracotta); border-radius: 1mm;
    }
    .wave { display: block; width: 100%; height: 5mm; margin-top: 2.5mm; }
    /* ---- body ---- */
    .content {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 1mm 7mm 2mm; text-align: center;
    }
    .prompt { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 12pt;
      color: var(--petrol); line-height: 1.12; }
    .prompt-sub { margin-top: 1mm; font-size: 6.5pt; font-weight: 500; color: var(--muted); }
    .qr-panel {
      margin: 5mm 0 2.5mm; padding: 3.5mm; background: #fff; border-radius: 3mm;
      box-shadow: 0 1.5mm 5mm rgba(13,70,80,0.14);
    }
    .qr { display: block; width: 32mm; height: 32mm; }
    .wa-line {
      display: inline-flex; align-items: center; gap: 2mm;
      font-size: 8.5pt; font-weight: 600; color: var(--ink);
    }
    .wa-line svg { width: 4.2mm; height: 4.2mm; fill: var(--wa); }
    /* ---- footer ---- */
    .foot {
      padding: 0 7mm 4mm; text-align: center;
      font-size: 7.5pt; font-weight: 600; letter-spacing: 0.04em; color: var(--muted);
    }
    .foot .dot { color: var(--terracotta); }
    /* screen-only preview backdrop */
    @media screen {
      body { padding: 24px; background: #d9d4c8; }
      .card { box-shadow: 0 12px 40px rgba(0,0,0,0.25); border-radius: 3mm; }
    }
  </style>
</head>
